<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="styles.css?v=3">
        <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.js"></script>
        <meta charset="UTF-8">
        <title>Shrimp Jams</title>
    </head>
    <body>
        <!-- Header -->
        <header>
            <h1>hello. Am shrimpy.</h1>
        </header>
        <nav>
            
        </nav>

        <!-- Main content -->
        <main>
            <div style="float:right; margin: 2rem">
                <div>
                    <audio id="shrimpAudio" controls>
                        <source src="assets/time-to-win.mp3" type="audio/mpeg">
                            Your browser does not support the audio element.
                    </audio>
                </div>
                <div>
                    <img id="shrimpImage" src="assets/shrimp.jpg" alt="shrimpy">
                </div>    
            </div>
            
            <p>Shrimpy likes to jam to royalty free music.</p>
            <p>Shrimpy needs a friend. Will you be a shrimp supporter?<p>
            <p><a href="https://patreon.com/shrimpjams?utm_medium=unknown&utm_source=join_link&utm_campaign=creatorshare_creator&utm_content=copyLink" target="_blank">Shrimpy's Patreon</a></h3>
        </main>
        
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const audio = document.getElementById('shrimpAudio');
                const image = document.getElementById('shrimpImage');
                
                audio.addEventListener('play', () => {
                    image.classList.add('spinning');
                });
                
                audio.addEventListener('pause', () => {
                    image.classList.remove('spinning');
                });
                
                audio.addEventListener('ended', () => {
                    image.classList.remove('spinning');
                });
            });
        </script>
        <script src="sketch.js"></script>
    </body>
</html>
